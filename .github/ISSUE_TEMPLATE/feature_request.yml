name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        请描述你希望添加的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 需求背景
      description: 这个功能解决了什么问题，或满足什么使用场景
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望插件如何实现这个功能
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      options:
        - 通知/消息格式
        - 监控逻辑
        - WebUI 配置
        - 统计图
        - 命令
        - 其他
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关上下文、截图、链接等
    validations:
      required: false
